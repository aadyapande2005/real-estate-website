  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: real-estate-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    # depends_on:
    #   - mongo

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: real-estate-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
